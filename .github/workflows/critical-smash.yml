name: critical-smash
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/critical_smash.py"
      - ".github/workflows/critical-smash.yml"
jobs:
  smash:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Run critical smash
        run: python3 scripts/critical_smash.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-results
          path: |
            artifacts/
            out/
      - name: Print summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in [Path('artifacts/critical_results.json'), Path('out/critical_results.json')]:
            if p.exists():
              d=json.loads(p.read_text())
              print('confirmed', d.get('confirmed_count'), d.get('confirmed'))
              print('leads', d.get('leads_count'))
              for L in (d.get('leads') or [])[:20]:
                print('LEAD', L)
              sk=d.get('vectors',{}).get('sharekey',{})
              print('share found', len(sk.get('found') or []), 'populated', sk.get('populated'))
              break
          PY
