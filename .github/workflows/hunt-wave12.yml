name: Hunt Wave 12
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/hunt_wave12_gha.py'
      - '.github/workflows/hunt-wave12.yml'

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run wave12
        run: python3 scripts/hunt_wave12_gha.py
      - uses: actions/upload-artifact@v4
        with:
          name: hunt-wave12
          path: |
            artifacts/hunt_wave12_gha.json
            out/hunt_wave12_gha.json
