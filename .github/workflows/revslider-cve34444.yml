name: revslider-cve34444
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/revslider_cve34444.py"
      - ".github/workflows/revslider-cve34444.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run RevSlider CVE-2024-34444 probe
        run: python3 scripts/revslider_cve34444.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revslider-cve34444
          path: |
            artifacts/
            out/
      - name: Print results
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in [Path('artifacts/revslider_cve34444.json'), Path('out/revslider_cve34444.json')]:
            if p.exists():
              d=json.loads(p.read_text())
              print('confirmed', d.get('confirmed'), 'nonce', d.get('nonce'))
              print('proof', d.get('proof'))
              for t in (d.get('tests') or [])[:30]:
                print(t.get('nonce_label'), t.get('endpoint'), t.get('code'), (t.get('body') or '')[:100])
              break
          PY
