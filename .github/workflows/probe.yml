name: kzn-post-probe
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe.py"
      - ".github/workflows/**"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run probe
        run: python3 scripts/probe.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kzn-results
          path: |
            artifacts/
            out/
      - name: Print results
        if: always()
        run: cat artifacts/results.json || cat out/results.json || true
