name: sharekey-smash
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/sharekey_smash.py"
      - ".github/workflows/sharekey-smash.yml"
jobs:
  smash:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Run share-key smash
        run: python3 scripts/sharekey_smash.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharekey-results
          path: |
            artifacts/
            out/
      - name: Print summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in [Path('artifacts/sharekey_results.json'), Path('out/sharekey_results.json')]:
            if p.exists():
              d=json.loads(p.read_text())
              print('found', d.get('found_count'), 'populated', d.get('populated_count'), 'confirmed', d.get('confirmed'))
              print('probe_n', d.get('probe_n'), 'key_pool', d.get('key_pool'))
              for x in d.get('populated', [])[:5]:
                print('POP', x)
              if d.get('sqli'):
                print('sqli confirmed', d['sqli'].get('confirmed'), d['sqli'].get('reason'))
              break
          PY
