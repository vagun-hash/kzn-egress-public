name: meesho-wave10
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Meesho Wave10
        run: python3 scripts/meesho_wave10_gha.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: meesho-wave10
          path: artifacts/meesho_wave10_gha.json
