name: critical-wave11
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/critical_wave11.py"
      - ".github/workflows/critical-wave11.yml"
jobs:
  smash:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run critical wave11
        run: python3 scripts/critical_wave11.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-wave11
          path: |
            artifacts/
            out/
      - name: Summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in [Path('artifacts/critical_wave11.json'), Path('out/critical_wave11.json')]:
            if p.exists():
              d = json.loads(p.read_text())
              print('confirmed', d.get('confirmed'))
              print('leads', d.get('leads'))
              sq = d.get('sqli') or []
              for s in sq:
                if s.get('verdict') == 'CONFIRMED':
                  print('SQLI CONFIRMED', s.get('share'))
              break
          PY
